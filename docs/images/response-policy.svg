<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">MirageOT response policy</title>
  <desc id="desc">When a session crosses the score threshold, default alert-only mode asks an analyst to review. Optional blocklist mode writes an unprotected source IP to a file for external firewall ingestion. Protected CIDRs are never added.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#5ac8b8"/></marker>
    <style>.title{font:700 24px Arial,sans-serif;fill:#ecf4f8}.head{font:700 17px Arial,sans-serif;fill:#eaf4f8}.body{font:14px Arial,sans-serif;fill:#afc3cf}.note{font:12px Arial,sans-serif;fill:#92aab7}.line{stroke:#5ac8b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#0e1720"/>
  <text x="40" y="52" class="title">OT-safe response policy</text>
  <rect x="40" y="123" width="232" height="140" rx="15" fill="#1b2b39" stroke="#416477"/>
  <text x="58" y="157" class="head">Session threshold</text>
  <text x="58" y="186" class="body">Score reaches configured</text>
  <text x="58" y="209" class="body">block_threshold</text>
  <text x="58" y="241" class="note">Event stays in the local log.</text>
  <rect x="342" y="97" width="245" height="112" rx="15" fill="#19353b" stroke="#44877d"/>
  <text x="360" y="132" class="head">Default: alert-only</text>
  <text x="360" y="161" class="body">Review the source.</text>
  <text x="360" y="184" class="body">No firewall change.</text>
  <rect x="342" y="235" width="245" height="112" rx="15" fill="#383124" stroke="#9a7d45"/>
  <text x="360" y="270" class="head">Opt-in: blocklist</text>
  <text x="360" y="299" class="body">Check never_block CIDRs</text>
  <text x="360" y="322" class="body">before writing an IP.</text>
  <rect x="666" y="235" width="220" height="112" rx="15" fill="#223640" stroke="#4d7580"/>
  <text x="684" y="270" class="head">Protected source</text>
  <text x="684" y="299" class="body">Review only.</text>
  <text x="684" y="322" class="body">Never append.</text>
  <rect x="935" y="235" width="224" height="112" rx="15" fill="#263740" stroke="#4c7b84"/>
  <text x="953" y="270" class="head">Unprotected source</text>
  <text x="953" y="299" class="body">Append to file for an</text>
  <text x="953" y="322" class="body">external firewall workflow.</text>
  <path d="M272 163H341" class="line"/><path d="M272 220H300V291H341" class="line"/>
  <path d="M587 291H665" class="line"/><path d="M886 291H934" class="line"/>
  <text x="40" y="380" class="note">A MirageOT blocklist entry does not itself block network traffic.</text>
</svg>
